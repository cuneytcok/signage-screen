<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Döviz Panosu — EUR / USD / GBP (Büyük Rakamlar)</title>
<style>
  :root { --bg:#0b1220; --panel:#0f172a; --fg:#e2e8f0; --muted:#94a3b8; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
  .wrap { display:flex; flex-direction:column; height:100%; }
  .header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; background:var(--panel); border-bottom:2px solid #1e293b; }
  .title { font-weight:700; letter-spacing:.3px; }
  .clock { font-variant-numeric:tabular-nums; font-size:20px; color:var(--muted); }
  .grid { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:16px; padding:16px; height:100%; box-sizing:border-box; }
  .cell { background:var(--panel); border-radius:16px; overflow:hidden; position:relative; display:flex; align-items:center; justify-content:center; }
  /* TradingView symbol-info widget'i büyütmek için ölçek uyguluyoruz */
  .tv-scale { transform: scale(1.45); transform-origin: 50% 10%; width: 100%; height: 100%; display:flex; align-items:center; justify-content:center; }
  /* Yatay/dikey taşmayı gizle */
  .cell > div { width:100%; height:100%; overflow:hidden; }
  /* Alt bilgi */
  .footer { padding:10px 16px; color:var(--muted); font-size:12px; text-align:center; }
  @media (max-width: 1400px) {
    .tv-scale { transform: scale(1.2); }
  }
  @media (max-width: 1100px) {
    .grid { grid-template-columns: 1fr; }
    .tv-scale { transform: scale(1.1); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="title">Döviz Panosu — EUR / USD / GBP</div>
    <div class="clock" id="clock"></div>
  </div>

  <div class="grid">
    <div class="cell">
      <div class="tv-scale">
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-info.js" async>
          {
            "symbol": "FX_IDC:EURTRY",
            "locale": "tr",
            "colorTheme": "dark",
            "isTransparent": false
          }
          </script>
        </div>
      </div>
    </div>

    <div class="cell">
      <div class="tv-scale">
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-info.js" async>
          {
            "symbol": "FX_IDC:USDTRY",
            "locale": "tr",
            "colorTheme": "dark",
            "isTransparent": false
          }
          </script>
        </div>
      </div>
    </div>

    <div class="cell">
      <div class="tv-scale">
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-info.js" async>
          {
            "symbol": "FX_IDC:GBPTRY",
            "locale": "tr",
            "colorTheme": "dark",
            "isTransparent": false
          }
          </script>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">TradingView verileri temel alınır. Görüntüleme için optimize edilmiştir.</div>
</div>

<script>
function updateClock(){
  const d=new Date();
  const days=["Paz","Pts","Sal","Çar","Per","Cum","Cts"];
  const dateStr = days[d.getDay()] + " " + d.toLocaleDateString('tr-TR');
  const timeStr = d.toLocaleTimeString('tr-TR');
  const el=document.getElementById('clock'); if(el) el.textContent = dateStr + " — " + timeStr;
}
setInterval(updateClock, 1000); updateClock();
</script>
</body>
</html>
