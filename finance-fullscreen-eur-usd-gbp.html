<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finans Ekranı (EUR, USD, GBP)</title>
<style>
  html, body { height:100%; margin:0; background:#0b1220; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color:#e2e8f0; }
  .wrap { display:flex; flex-direction:column; height:100%; }
  .header { display:flex; justify-content:space-between; align-items:center; background:#0f172a; padding:12px 20px; font-size:20px; color:#cbd5e1; border-bottom:2px solid #1e293b; }
  .clock { font-variant-numeric: tabular-nums; font-size:18px; }
  .main { flex:1 1 auto; display:flex; }
  .panel { flex:1 1 100%; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>Finans Ekranı — EUR / USD / GBP</div>
    <div class="clock" id="clock"></div>
  </div>

  <div class="main">
    <div class="panel">
      <div class="tradingview-widget-container" style="height:100%;">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
        {
          "colorTheme": "dark",
          "dateRange": "1M",
          "showChart": true,
          "locale": "tr",
          "isTransparent": false,
          "showSymbolLogo": true,
          "width": "100%",
          "height": "100%",
          "tabs": [
            {
              "title": "Döviz",
              "symbols": [
                {"s": "FX_IDC:EURTRY", "d": "EUR/TRY"},
                {"s": "FX_IDC:USDTRY", "d": "USD/TRY"},
                {"s": "FX_IDC:GBPTRY", "d": "GBP/TRY"}
              ]
            }
          ]
        }
        </script>
      </div>
    </div>
  </div>
</div>

<script>
function updateClock(){
  const d=new Date();
  const days=["Paz","Pts","Sal","Çar","Per","Cum","Cts"];
  const dateStr = days[d.getDay()] + " " + d.toLocaleDateString('tr-TR');
  const timeStr = d.toLocaleTimeString('tr-TR');
  document.getElementById('clock').textContent = dateStr + " — " + timeStr;
}
setInterval(updateClock,1000);
updateClock();
</script>
</body>
</html>
