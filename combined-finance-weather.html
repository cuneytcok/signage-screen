<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finans + Hava (Bölünmüş Ekran)</title>
<style>
  html, body { height:100%; margin:0; background:#0b1220; }
  .grid { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:auto 1fr; gap:8px; height:100%; padding:8px; box-sizing:border-box; }
  .cell { background:#0f172a; border-radius:12px; overflow:hidden; }
  .header { grid-column:1 / span 2; background:#0f172a; color:#cbd5e1; font:600 18px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; display:flex; justify-content:space-between; padding:8px 12px; border-radius:12px; }
</style>
</head>
<body>
<div class="grid">
  <div class="header">
    <div>Finans & Hava Durumu</div>
    <div id="clock"></div>
  </div>

  <div class="cell">
    <div class="tradingview-widget-container" style="height:100%;">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
      {
        "colorTheme": "dark",
        "locale": "tr",
        "showChart": true,
        "tabs": [
          {"title":"Borsa","symbols":[{"s":"BIST:XU100","d":"BIST 100"},{"s":"BIST:XU030","d":"BIST 30"}]},
          {"title":"Döviz","symbols":[{"s":"FX_IDC:USDTRY","d":"USD/TRY"},{"s":"FX_IDC:EURTRY","d":"EUR/TRY"}]},
          {"title":"Emtia","symbols":[{"s":"CAPITALCOM:XAUTRY","d":"Altın/TRY"},{"s":"CRYPTO:BTCUSD","d":"BTC/USD"}]}
        ]
      }
      </script>
    </div>
  </div>

  <div class="cell">
    <a class="weatherwidget-io" href="https://forecast7.com/tr/41d01n28d97/istanbul/" data-label_1="İSTANBUL" data-label_2="HAVA DURUMU" data-days="5" data-theme="dark">İSTANBUL HAVA DURUMU</a>
  </div>
</div>

<script>
function updateClock(){
  const d=new Date();
  document.getElementById('clock').textContent=d.toLocaleTimeString('tr-TR');
}
setInterval(updateClock,1000);
updateClock();

!function(d,s,id){
  var js,fjs=d.getElementsByTagName(s)[0];
  if(!d.getElementById(id)){
    js=d.createElement(s);js.id=id;js.src='https://weatherwidget.io/js/widget.min.js';
    fjs.parentNode.insertBefore(js,fjs);
  }
}(document,'script','weatherwidget-io-js');
</script>
</body>
</html>
