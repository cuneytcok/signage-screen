<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tam Sayfa Finans Ekranı (TR)</title>
<style>
  html, body { height:100%; margin:0; background:#0b1220; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  .wrap { display:flex; flex-direction:column; height:100%; }
  .tape { flex:0 0 auto; }
  .main { flex:1 1 auto; display:flex; }
  .panel { flex:1 1 100%; }
</style>
</head>
<body>
<div class="wrap">
  <div class="tape">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
      {
        "symbols": [
          {"proName": "BIST:XU100", "title": "BIST 100"},
          {"proName": "FX_IDC:USDTRY", "title": "USD/TRY"},
          {"proName": "FX_IDC:EURTRY", "title": "EUR/TRY"},
          {"proName": "CAPITALCOM:XAUTRY", "title": "Altın/TRY"},
          {"proName": "CRYPTO:BTCUSD", "title": "BTC/USD"}
        ],
        "showSymbolLogo": true,
        "colorTheme": "dark",
        "locale": "tr"
      }
      </script>
    </div>
  </div>

  <div class="main">
    <div class="panel">
      <div class="tradingview-widget-container" style="height:100%;">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
        {
          "colorTheme": "dark",
          "dateRange": "12M",
          "showChart": true,
          "locale": "tr",
          "isTransparent": false,
          "showSymbolLogo": true,
          "width": "100%",
          "height": "100%",
          "tabs": [
            {
              "title": "Borsa",
              "symbols": [
                {"s": "BIST:XU100", "d": "BIST 100"},
                {"s": "BIST:XU030", "d": "BIST 30"},
                {"s": "BIST:ASELS", "d": "Aselsan"},
                {"s": "BIST:THYAO", "d": "THY"},
                {"s": "BIST:SAHOL", "d": "Sabancı"}
              ]
            },
            {
              "title": "Döviz",
              "symbols": [
                {"s": "FX_IDC:USDTRY", "d": "USD/TRY"},
                {"s": "FX_IDC:EURTRY", "d": "EUR/TRY"},
                {"s": "FX_IDC:GBPTRY", "d": "GBP/TRY"}
              ]
            },
            {
              "title": "Emtia & Kripto",
              "symbols": [
                {"s": "CAPITALCOM:XAUTRY", "d": "Altın/TRY"},
                {"s": "CRYPTO:BTCUSD", "d": "Bitcoin"},
                {"s": "CRYPTO:ETHUSD", "d": "Ethereum"}
              ]
            }
          ]
        }
        </script>
      </div>
    </div>
  </div>
</div>
</body>
</html>
